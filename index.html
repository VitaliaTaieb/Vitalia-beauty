<!DOCTYPE html>

<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VITALIA BEAUTY</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#090909;color:#f5e8ca;font-family:Arial,sans-serif;text-align:center}

header{padding:55px 20px;background:linear-gradient(#17130b,#090909)}

h1{font-family:Georgia,serif;font-size:44px;letter-spacing:4px;color:#d4af65;margin:0}

.gold{color:#d4af65}

.subtitle{font-size:15px;letter-spacing:2px}

section{padding:28px 20px}

.card{border:1px solid #a8874;padding:20px;border-radius:15px;margin-bottom:20px}
 
 dialog#booking {
  background: #111111;
  color: #d4af65;
  border: 1px solid #d4af65;
  border-radius: 18px;
  padding: 28px;
  width: 90%;
  max-width: 420px;
  text-align: right;
}

dialog#booking::backdrop {
  background: rgba(0, 0, 0, 0.8);
}

#booking h2 {
  text-align: center;
  color: #d4af65;
}

#booking form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#booking input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d4af65;
  border-radius: 8px;
  font-size: 16px;
}

#booking button {
  padding: 12px;
  border: 1px solid #d4af65;
  border-radius: 8px;
  background: #d4af65;
  color: #111111;
  font-size: 16px;
  cursor: pointer;
}
 </style>

</head>



<script>
function openBooking(salon) {
  document.getElementById('salonName').textContent = salon;
  document.getElementById('booking').showModal();
}
let calendarMonth = new Date();

const hebrewMonths = [
'ינואר','פברואר','מרץ','אפריל',
'מאי','יוני','יולי','אוגוסט',
'ספטמבר','אוקטובר','נובמבר','דצמבר'
];

const hebrewDays = ['א','ב','ג','ד','ה','ו','ש'];

function openHebrewCalendar() {
  document.getElementById('hebrewCalendar').style.display = 'block';
  renderHebrewCalendar();
}

function changeMonth(n) {
  calendarMonth.setDate(1);
  calendarMonth.setMonth(calendarMonth.getMonth() + n);
  renderHebrewCalendar();
}

function renderHebrewCalendar() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const grid = document.getElementById('calendarDays');

  document.getElementById('calendarTitle').textContent =
    hebrewMonths[month] + ' ' + year;

  grid.innerHTML = '';

  hebrewDays.forEach(day => {
    const el = document.createElement('strong');
    el.textContent = day;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const total = new Date(year, month + 1, 0).getDate();
  const today = new Date();
  today.setHours(0,0,0,0);

  for (let i = 0; i < firstDay; i++) {
    grid.appendChild(document.createElement('span'));
  }

  for (let day = 1; day <= total; day++) {
    const date = new Date(year, month, day);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = day;
    btn.disabled = date < today;
    btn.style.cssText =
      'padding:8px 0;background:#222;color:#d4af65;border:1px solid #d4af65;border-radius:6px';

    btn.onclick = () => {
      const input = document.getElementById('bookingDate');
      input.value = new Intl.DateTimeFormat('he-IL', {
        day:'numeric', month:'long', year:'numeric'
      }).format(date);
      input.dataset.iso = year + '-' +
        String(month + 1).padStart(2,'0') + '-' +
        String(day).padStart(2,'0');
      document.getElementById('hebrewCalendar').style.display = 'none';
    };

    grid.appendChild(btn);
  }
}
</script>




<body>
<dialog id="booking" dir="rtl">
  <h2>קביעת תור</h2>
  <p id="salonName"></p>
  <form id="bookingForm" onsubmit="event.preventDefault(); alert('ההזמנה עדיין לא פעילה');">
    <label>שם מלא</label>
    <input type="text" required>
    <label>טלפון</label>
    <input type="tel" required>
    <label>תאריך</label>
    


<input type="text" id="bookingDate" placeholder="בחרי תאריך" readonly required onclick="openHebrewCalendar()">
   <div id="hebrewCalendar" dir="rtl" style="display:none;background:#111;color:#d4af65;border:1px solid #d4af65;border-radius:12px;padding:15px;margin-top:10px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button type="button" onclick="changeMonth(-1)">❮</button>
<strong id="calendarTitle"></strong>
<button type="button" onclick="changeMonth(1)">❯</button>
</div>
<div id="calendarDays" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px;text-align:center"></div>
</div>
   <label>בחרי טיפול</label>
<select id="service" required>
  <option value="">בחרי טיפול</option>
</select>
   <label>בחרי שעה</label>
<input type="time" id="bookingTime" required>
    <button type="button" onclick="document.getElementById('booking').close()">ביטול</button>
    <button type="submit">סגירה</button>
  </form>
</dialog>
<header>

<h1>VITALIA <span class="gold">BEAUTY</span></h1>

<p class="subtitle">יופי שמתחיל בך</p>

</header>

<section>

<div class="card">

<h2>Vitalia Beauty — כפר יונה</h2>

<p>נחל דלתון 34</p>
<button onclick="openBooking('Vitalia Beauty')">לקביעת תור</button>
</div>

<div class="card">

<h2>Vitalia Taieb — נתניה</h2>
<p>אמנון ותמר 6, קומה 2</p>
<button onclick="openBooking('Vitalia Taieb')">לקביעת תור</button>
</div>

</section>

</body>

</html>
