<!DOCTYPE html>

<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VITALIA BEAUTY</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#090909;color:#f5e8ca;font-family:Arial,sans-serif;text-align:center}

header{padding:55px 20px;background:linear-gradient(#17130b,#090909)}

h1{font-family:Georgia,serif;font-size:44px;letter-spacing:4px;color:#d4af65;margin:0}

.gold{color:#d4af65}

.subtitle{font-size:15px;letter-spacing:2px}

section{padding:28px 20px}

.card{border:1px solid #a8874;padding:20px;border-radius:15px;margin-bottom:20px}
 </style>

</head>



<script>
function openBooking(salon) {
  document.getElementById('salonName').textContent = salon;
  document.getElementById('booking').showModal();
}
</script>




<body>
<dialog id="booking" dir="rtl">
  <h2>קביעת תור</h2>
  <p id="salonName"></p>
  <form method="dialog">
    <label>שם מלא</label>
    <input type="text" required>
    <label>טלפון</label>
    <input type="tel" required>
    <label>תאריך</label>
    <input type="date" required>
    <button type="button" onclick="alert('הטופס עדיין בבנייה')">המשך</button>
    <button type="submit">סגירה</button>
  </form>
</dialog>
<header>

<h1>VITALIA <span class="gold">BEAUTY</span></h1>

<p class="subtitle">יופי שמתחיל בך</p>

</header>

<section>

<div class="card">

<h2>Vitalia Beauty — כפר יונה</h2>

<p>נחל דלתון 34</p>
<button onclick="openBooking('Vitalia Beauty')">לקביעת תור</button>
</div>

<div class="card">

<h2>Vitalia Taieb — נתניה</h2>
<p>אמנון ותמר 6, קומה 2</p>
<button onclick="openBooking('Vitalia Taieb')">לקביעת תור</button>
</div>

</section>

</body>

</html>
