<!DOCTYPE html>

<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VITALIA BEAUTY</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#090909;color:#f5e8ca;font-family:Arial,sans-serif;text-align:center}

header{padding:55px 20px;background:linear-gradient(#17130b,#090909)}

h1{font-family:Georgia,serif;font-size:44px;letter-spacing:4px;color:#d4af65;margin:0}

.gold{color:#d4af65}

.subtitle{font-size:15px;letter-spacing:2px}

section{padding:28px 20px}

.card{border:1px solid #a8874;padding:20px;border-radius:15px;margin-bottom:20px}
 
 dialog#booking {
  background: #111111;
  color: #d4af65;
  border: 1px solid #d4af65;
  border-radius: 18px;
  padding: 28px;
  width: 90%;
  max-width: 420px;
  text-align: right;
}

dialog#booking::backdrop {
  background: rgba(0, 0, 0, 0.8);
}

#booking h2 {
  text-align: center;
  color: #d4af65;
}

#booking form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#booking input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d4af65;
  border-radius: 8px;
  font-size: 16px;
}

#booking button {
  padding: 12px;
  border: 1px solid #d4af65;
  border-radius: 8px;
  background: #d4af65;
  color: #111111;
  font-size: 16px;
  cursor: pointer;
}
 </style>

</head>



<script>
function openBooking(salon) {
  document.getElementById('salonName').textContent = salon;
  document.getElementById('booking').showModal();
}
</script>




<body>
<dialog id="booking" dir="rtl">
  <h2>קביעת תור</h2>
  <p id="salonName"></p>
  <form id="bookingForm" onsubmit="event.preventDefault(); alert('ההזמנה עדיין לא פעילה');">
    <label>שם מלא</label>
    <input type="text" required>
    <label>טלפון</label>
    <input type="tel" required>
    <label>תאריך</label>
    <input type="date" required>
   <label>בחרי טיפול</label>
<select id="service" required>
  <option value="">בחרי טיפול</option>
</select>
   <label>בחרי שעה</label>
<input type="time" id="bookingTime" required>
    <button type="button" onclick="document.getElementById('booking').close()">ביטול</button
    <button type="submit">סגירה</button>
  </form>
</dialog>
<header>

<h1>VITALIA <span class="gold">BEAUTY</span></h1>

<p class="subtitle">יופי שמתחיל בך</p>

</header>

<section>

<div class="card">

<h2>Vitalia Beauty — כפר יונה</h2>

<p>נחל דלתון 34</p>
<button onclick="openBooking('Vitalia Beauty')">לקביעת תור</button>
</div>

<div class="card">

<h2>Vitalia Taieb — נתניה</h2>
<p>אמנון ותמר 6, קומה 2</p>
<button onclick="openBooking('Vitalia Taieb')">לקביעת תור</button>
</div>

</section>

</body>

</html>
