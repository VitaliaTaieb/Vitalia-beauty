<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITALIA BEAUTY | קביעת תור</title>
<style>
:root{--bg:#090909;--panel:#15120e;--gold:#d4af65;--text:#f5e8ca;--muted:#c9b994}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;text-align:center}header{padding:55px 20px 38px;background:linear-gradient(#17130b,#090909)}h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,48px);letter-spacing:3px;color:var(--gold);margin:0}.subtitle{font-size:15px;letter-spacing:1px}.gold{color:var(--gold)}main{max-width:740px;margin:auto;padding:15px 20px 70px}.card{border:1px solid #a8874f;border-radius:15px;padding:24px 20px;margin-bottom:22px;background:#100e0b}.card h2{color:var(--gold);margin-top:0}.card p{color:var(--muted)}button,select,input{font:inherit}button{cursor:pointer;border-radius:8px;border:1px solid var(--gold);padding:12px 19px;background:var(--gold);color:#15110b;font-weight:bold}button:disabled{opacity:.55;cursor:not-allowed}.outline{background:transparent;color:var(--gold)}dialog#booking{background:#111;color:var(--gold);border:1px solid var(--gold);border-radius:18px;padding:26px;max-width:460px;width:calc(100% - 28px);max-height:90vh;overflow:auto;text-align:right}dialog#booking::backdrop{background:rgba(0,0,0,.83)}#booking h2{text-align:center;margin-top:0}#booking form{display:flex;flex-direction:column;gap:12px}#booking label{font-weight:bold}#booking input,#booking select{width:100%;padding:12px;border:1px solid var(--gold);border-radius:8px;font-size:16px;background:#faf7ef;color:#15110b}#booking input[readonly]{cursor:pointer}.helper{font-size:13px;color:var(--muted);line-height:1.6}.actions{display:flex;gap:10px;margin-top:8px}.actions button{flex:1}.calendar{border:1px solid var(--gold);border-radius:12px;padding:12px;background:#17140f}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.calendar-head button{padding:6px 12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;text-align:center}.calendar-grid strong{font-size:13px}.calendar-grid button{padding:9px 0;min-width:0;background:#252118;color:var(--gold);font-weight:normal}.calendar-grid button.available{background:#b18d49;color:#0b0b0b}.calendar-grid button.selected{outline:2px solid #fff;outline-offset:1px}.calendar-grid button:disabled{background:#17140f;border-color:#51452e;color:#766c57;opacity:.65}.calendar-grid .empty{min-height:30px}#status{min-height:1.4em}#turnstileWidget{min-height:65px;display:flex;justify-content:center}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
<header><h1>VITALIA <span class="gold">BEAUTY</span></h1><p class="subtitle">יופי שמתחיל בך</p></header>
<main>
<section class="card"><h2>Vitalia Beauty — כפר יונה</h2><p>נחל דלתון 34</p><button type="button" onclick="openBooking(1)">לקביעת תור</button></section>
<section class="card"><h2>Vitalia Taieb — נתניה</h2><p>אמנון ותמר 6, קומה 2</p><button type="button" onclick="openBooking(2)">לקביעת תור</button></section>
</main>
<dialog id="booking" aria-labelledby="bookingHeading" dir="rtl">
<h2 id="bookingHeading">קביעת תור</h2><p id="salonName"></p>
<form id="bookingForm">
<label for="clientName">שם מלא</label><input type="text" id="clientName" autocomplete="name" required maxlength="100">
<label for="clientPhone">טלפון</label><input type="tel" id="clientPhone" autocomplete="tel" required maxlength="30" inputmode="tel">
<label for="service">בחרי טיפול</label><select id="service" required><option value="">טוען טיפולים…</option></select>
<label for="bookingDate">תאריך</label><input id="bookingDate" type="text" placeholder="בחרי תאריך" readonly required>
<div class="calendar" id="hebrewCalendar" hidden>
<div class="calendar-head"><button type="button" class="outline" id="prevMonth" aria-label="חודש קודם">❮</button><strong id="calendarTitle"></strong><button type="button" class="outline" id="nextMonth" aria-label="חודש הבא">❯</button></div>
<div id="calendarDays" class="calendar-grid"></div>
</div>
<label for="bookingTime">בחרי שעה</label><select id="bookingTime" required disabled><option value="">בחרי תאריך וטיפול תחילה</option></select>
<div id="turnstileWidget" aria-label="אימות אבטחה"></div>
<p id="status" class="helper" role="status" aria-live="polite"></p>
<p class="helper">האישור הסופי יתקבל לאחר בדיקת זמינות התור.</p>
<div class="actions"><button type="button" id="closeBooking" class="outline">סגירה</button><button type="submit" disabled id="submitBooking">אישור תור</button></div>
</form></dialog>
<script>
'use strict';
const SUPABASE_URL='https://nsazdqspilhjdtdkjgwg.supabase.co';
const SUPABASE_KEY='sb_publishable_akdZUTsjf7rT7bGrBl85_A_sex-4Oas';
const TURNSTILE_SITE_KEY='0x4AAAAAAF5NVlgw78EJDJWe';
const BOOKING_URL=SUPABASE_URL+'/functions/v1/vitalia-create-booking';
const salons={1:'Vitalia Beauty — כפר יונה',2:'Vitalia Taieb — נתניה'};
const dialog=document.getElementById('booking');
const serviceSelect=document.getElementById('service');
const dateInput=document.getElementById('bookingDate');
const timeSelect=document.getElementById('bookingTime');
const calendar=document.getElementById('hebrewCalendar');
const statusEl=document.getElementById('status');
const submitButton=document.getElementById('submitBooking');
let selectedSalonId=null,services=[],slots=[],monthCursor=new Date(),activeDay='',turnstileToken='',widgetId=null,sending=false;
const dayFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'});
const localFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const hebrewMonthFmt=new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'});
const hebrewDateFmt=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric'});
const DOW=['א','ב','ג','ד','ה','ו','ש'];
function isoLocal(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function todayIsrael(){const parts=dayFmt.formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value;return `${get('year')}-${get('month')}-${get('day')}`}
function setStatus(message){statusEl.textContent=message}
function refreshButton(){submitButton.disabled=sending||!turnstileToken||!selectedSalonId||!serviceSelect.value||!dateInput.dataset.iso||!timeSelect.value}
function renderTurnstile(){
 if(!window.turnstile){setTimeout(()=>{if(dialog.open)renderTurnstile()},300);return}
 if(widgetId!==null){window.turnstile.reset(widgetId);turnstileToken='';refreshButton();return}
 widgetId=window.turnstile.render('#turnstileWidget',{
  sitekey:TURNSTILE_SITE_KEY,theme:'dark',language:'he',
  callback:token=>{turnstileToken=token;refreshButton()},
  'expired-callback':()=>{turnstileToken='';refreshButton();setStatus('האימות פג. נסי שוב.')},
  'error-callback':()=>{turnstileToken='';refreshButton();setStatus('לא ניתן לבצע אימות כעת.')},
 });
}
async function readPublic(table,params){const url=new URL(`${SUPABASE_URL}/rest/v1/${table}`);for(const [key,val] of Object.entries(params))url.searchParams.set(key,val);const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Accept:'application/json'}});if(!res.ok)throw Error(`Unable to load ${table}`);return await res.json()}
window.openBooking=async function(salonId){
 if(!salons[salonId])return;
 selectedSalonId=salonId;services=[];slots=[];activeDay='';turnstileToken='';sending=false;
 document.getElementById('bookingForm').reset();delete dateInput.dataset.iso;
 document.getElementById('salonName').textContent=salons[salonId];
 serviceSelect.innerHTML='<option value="">טוען טיפולים…</option>';serviceSelect.disabled=true;
 timeSelect.innerHTML='<option value="">בחרי תאריך וטיפול תחילה</option>';timeSelect.disabled=true;
 calendar.hidden=true;setStatus('טוען פרטים…');dialog.showModal();refreshButton();renderTurnstile();
 monthCursor=new Date();monthCursor.setDate(1);
 try{
  const [allServices,allSlots]=await Promise.all([
   readPublic('services',{select:'*',order:'name.asc',limit:'1000'}),
   readPublic('available_slots',{select:'salon_id,work_date,start_time,end_time',salon_id:`eq.${salonId}`,work_date:`gte.${todayIsrael()}`,order:'work_date.asc',limit:'1000'})
  ]);
  if(selectedSalonId!==salonId)return;
  services=allServices.filter(s=>Number(s['salon_id.'])===salonId&&Number(s.duration_minutes)>0);
  slots=allSlots.filter(s=>Number(s.salon_id)===salonId);
  serviceSelect.replaceChildren(new Option('בחרי טיפול',''));
  for(const s of services)serviceSelect.add(new Option(`${s.name} — ₪${s.price}`,String(s.id)));
  serviceSelect.disabled=false;setStatus(services.length?'בחרי טיפול ותאריך.':'אין טיפולים זמינים כרגע.');renderCalendar();refreshButton();
 }catch{serviceSelect.replaceChildren(new Option('לא ניתן לטעון טיפולים',''));setStatus('לא ניתן לטעון את הנתונים. נסי שוב מאוחר יותר.')}
};
function renderCalendar(){
 const grid=document.getElementById('calendarDays');grid.replaceChildren();
 const y=monthCursor.getFullYear(),m=monthCursor.getMonth();
 document.getElementById('calendarTitle').textContent=hebrewMonthFmt.format(new Date(y,m,1));
 for(const d of DOW){const header=document.createElement('strong');header.textContent=d;grid.append(header)}
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),available=new Set(slots.map(s=>s.work_date)),today=todayIsrael();
 for(let i=0;i<first;i++){const blank=document.createElement('span');blank.className='empty';grid.append(blank)}
 for(let d=1;d<=days;d++){
  const date=new Date(y,m,d),key=isoLocal(date),btn=document.createElement('button');btn.type='button';btn.textContent=String(d);
  btn.disabled=key<today||!available.has(key);if(available.has(key)&&key>=today)btn.classList.add('available');if(key===activeDay)btn.classList.add('selected');
  btn.onclick=()=>{activeDay=key;dateInput.value=hebrewDateFmt.format(date);dateInput.dataset.iso=key;calendar.hidden=true;renderTimes();};grid.append(btn)
 }
}
function timeToMinutes(t){const m=/^(\d{2}):(\d{2})/.exec(t||'');return m?Number(m[1])*60+Number(m[2]):NaN}
function renderTimes(){
 timeSelect.replaceChildren(new Option('בחרי שעה',''));timeSelect.disabled=true;
 const service=services.find(s=>String(s.id)===serviceSelect.value);
 if(!service||!activeDay){setStatus('בחרי טיפול ותאריך.');refreshButton();return}
 const duration=Number(service.duration_minutes),starts=new Set();
 for(const slot of slots.filter(s=>s.work_date===activeDay)){
  const start=timeToMinutes(slot.start_time),end=timeToMinutes(slot.end_time);
  if(!Number.isFinite(start)||!Number.isFinite(end))continue;
  for(let t=Math.ceil(start/15)*15;t+duration<=end;t+=15){const hh=String(Math.floor(t/60)).padStart(2,'0'),mm=String(t%60).padStart(2,'0');starts.add(`${hh}:${mm}`)}
 }
 for(const t of [...starts].sort())timeSelect.add(new Option(t,t));
 timeSelect.disabled=starts.size===0;setStatus(starts.size?'בחרי שעה. הזמינות תיבדק שוב באישור.':'אין שעות מתאימות בתאריך זה.');refreshButton();
}
function getIsraelTimestamp(day,time){
 // For Israeli standard/DST hours choose the offset that maps to the desired wall time.
 for(const offset of ['+02:00','+03:00']){
  const iso=`${day}T${time}:00${offset}`;
  const d=new Date(iso);
  const p=localFmt.formatToParts(d);const get=t=>p.find(x=>x.type===t)?.value;
  if(`${get('year')}-${get('month')}-${get('day')}`===day&&`${get('hour')}:${get('minute')}`===time)return iso;
 }
 return null;
}
const errorTexts={BOOKING_OVERLAP:'השעה הזו כבר תפוסה. אנא בחרי שעה אחרת.',SLOT_UNAVAILABLE:'השעה הזו אינה זמינה יותר.',SALON_CLOSED:'הסלון סגור בתאריך שבחרת.',CHALLENGE_FAILED:'אימות האבטחה נכשל. נסי שוב.',CHALLENGE_UNAVAILABLE:'האימות אינו זמין כעת. נסי שוב מאוחר יותר.'};
document.getElementById('bookingForm').onsubmit=async event=>{
 event.preventDefault();if(sending||!turnstileToken)return;
 const startsAt=getIsraelTimestamp(dateInput.dataset.iso,timeSelect.value);
 if(!startsAt){setStatus('השעה שבחרת אינה תקינה.');return}
 sending=true;refreshButton();setStatus('מאשרים את התור…');
 try{
  const response=await fetch(BOOKING_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({salon_id:selectedSalonId,service_id:Number(serviceSelect.value),client_name:document.getElementById('clientName').value,client_phone:document.getElementById('clientPhone').value,starts_at:startsAt,turnstile_token:turnstileToken})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok){setStatus(errorTexts[result.error]||'לא ניתן לאשר את התור. נסי שוב.');return}
  setStatus('התור נקבע בהצלחה! מספר הזמנה: '+result.booking.id);submitButton.textContent='התור אושר';
  document.getElementById('bookingForm').querySelectorAll('input,select').forEach(x=>x.disabled=true);
 }catch{setStatus('שגיאת תקשורת. בדקי את החיבור ונסי שוב.')}
 finally{sending=false;turnstileToken='';if(window.turnstile&&widgetId!==null)window.turnstile.reset(widgetId);refreshButton()}
};
document.getElementById('prevMonth').onclick=()=>{monthCursor.setDate(1);monthCursor.setMonth(monthCursor.getMonth()-1);renderCalendar()};
document.getElementById('nextMonth').onclick=()=>{monthCursor.setDate(1);monthCursor.setMonth(monthCursor.getMonth()+1);renderCalendar()};
dateInput.onclick=()=>{calendar.hidden=!calendar.hidden;if(!calendar.hidden)renderCalendar()};
serviceSelect.onchange=renderTimes;timeSelect.onchange=refreshButton;
document.getElementById('closeBooking').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>{selectedSalonId=null;turnstileToken='';if(window.turnstile&&widgetId!==null)window.turnstile.reset(widgetId);submitButton.textContent='אישור תור';document.getElementById('bookingForm').querySelectorAll('input,select').forEach(x=>x.disabled=false)});
</script>
</body>
</html>
